name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Unit + contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shiftpatch
          POSTGRES_PASSWORD: shiftpatch
          POSTGRES_DB: shiftpatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shiftpatch" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway credentials for the ephemeral CI database only.
      DATABASE_URL: postgres://shiftpatch:shiftpatch@localhost:5432/shiftpatch
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-000
      ALLOW_DEMO_RESET: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate && npm run db:seed
      - run: npm run build
      - run: npm run e2e
      - name: Contract smoke over HTTP
        run: |
          npm run start &
          npx wait-on -t 60000 http://localhost:3000/login
          npm run smoke -- http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  security:
    name: Dependency audit · Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production dependencies must have no high/critical advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Full audit (report only — dev-tooling advisories without upstream fixes)
        run: npm audit || true
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
